[general]
bars = 28
bar_width = 3
bar_spacing = 2
framerate = 60
sensitivity = 90
autosens = 1
overshoot = 20
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = left
ascii_max_range = 1000
bar_delim = 58

[color]
gradient = 1
gradient_count = 4
gradient_color_1 = '#665D98'
gradient_color_2 = '#AB6B9E'
gradient_color_3 = '#DD7EAF'
gradient_color_4 = '#E18FB9'

[smoothing]
noise_reduction = 0.4
integral = 40
monstercat = 1
gravity = 100
ignore = 0