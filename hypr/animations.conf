animations {
    enabled = yes

    # Smooth overshoot — window open
    bezier = wind,         0.05, 0.9,  0.1, 1.05

    # Snappier entry — slight bounce
    bezier = winIn,        0.1,  1.05, 0.1, 1.05

    # Fast exit — no bounce
    bezier = winOut,       0.3,  0.0,  0.0, 1.0

    # Strict linear — border rotation
    bezier = liner,        1.0,  1.0,  1.0, 1.0

    # Almost-linear fade — subtle ease
    bezier = almostLinear, 0.5,  0.5,  0.75, 1.0


    # ── Windows ───────────────────────────────────────────────────
    animation = windows,      1, 5,  wind,   slide
    animation = windowsIn,    1, 5,  winIn,  slide
    animation = windowsOut,   1, 4,  winOut, slide
    animation = windowsMove,  1, 4,  wind,   slide

    # ── Border ────────────────────────────────────────────────────
    animation = border,       1, 1,  liner
    animation = borderangle,  1, 30, liner,  loop

    # ── Layers (overlay, launcher, etc) ───────────────────────────
    animation = layers,       1, 4,  wind,   popin 85%
    animation = layersIn,     1, 4,  winIn,  popin 85%
    animation = layersOut,    1, 3,  winOut, popin 85%

    # ── Workspaces ────────────────────────────────────────────────
    animation = workspaces,   1, 4,  wind,   slide

    # ── Fade ──────────────────────────────────────────────────────
    animation = fadeIn,       1, 1.5, almostLinear
    animation = fadeOut,      1, 1.3, almostLinear
    animation = fade,         1, 2.5, almostLinear
}


general {
    gaps_in              = 5
    gaps_out             = 10
    border_size          = 2

    layout               = dwindle
    resize_on_border     = true         # drag pinggir window buat resize
    extend_border_grab_area = 10        # area grab border lebih lebar
    hover_icon_on_border = true
}


decoration {
    rounding             = 12
    rounding_power       = 2.0          # makin besar makin bulat sudutnya

    # Opacity — inactive window sedikit redup
    active_opacity       = 1.0
    inactive_opacity     = 0.90
    fullscreen_opacity   = 1.0

    # Dim inactive — biar fokus lebih kelihatan
    dim_inactive         = true
    dim_strength         = 0.12
    dim_special          = 0.3

    # Shadow
    shadow {
        enabled          = true
        range            = 20
        render_power     = 3
        sharp            = false
        offset           = 0, 4
        scale            = 0.97
    }

    # Blur
    blur {
        enabled              = true
        size                 = 3
        passes               = 3
        new_optimizations    = true
        xray                 = false
        ignore_opacity       = false
        popups               = true     # blur juga di popup/tooltip
        popups_ignorealpha   = 0.2
    }
}


misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true

    # Animasi saat pertama buka — window muncul lebih natural
    animate_manual_resizes   = true
    animate_mouse_windowdragging = true

    focus_on_activate        = false    # jangan paksa fokus saat ada notif
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}
