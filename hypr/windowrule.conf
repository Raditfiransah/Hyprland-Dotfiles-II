# Variables
$notInFocusOpacity = 1

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}



# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}



# Opacity rules
windowrule {
  name = windowrule-3
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*().*$
}

windowrule {
  name = windowrule-4
  opacity = 1 
  match:class = .*(kitty|ghostty).*$
}

windowrule {
  name = windowrule-5
  fullscreen = on
  tile = on
  match:class = ^(Lunar Client.*)$
}

windowrule {
  name = windowrule-6
  opacity = $inFocusOpacity $notInFocusOpacity
  match:class = ^(firefox|brave|chromium|librewolf|qutebrowser|zen-browser)$
}

windowrule {
  name = windowrule-7
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*(Spotify).*$
}

windowrule {
  name = windowrule-8
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*(Discord).*$
}

windowrule {
  name = windowrule-9
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*(Telegram).*$
}

windowrule {
  name = windowrule-10
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*(Code).*$
}

windowrule {
  name = windowrule-11
  opacity = $inFocusOpacity $notInFocusOpacity
  match:title = ^.*(Thunar|nemo).*$
}

# Cava visualizer (floating pojok kanan-bawah, pinned semua workspace)
windowrule {
  name = windowrule-cava
  match:class = ^(cava)$
  float = on
  size = 520 220
  pin = on
  no_initial_focus = on
  no_anim = on
  border_size = 0
  opacity = 0.92 0.92
}

